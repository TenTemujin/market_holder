<svg xmlns="http://www.w3.org/2000/svg" width="820" height="104" viewBox="0 0 820 104" role="img" aria-label="Market Holder">
  <rect width="820" height="104" fill="#060606"/>
  <line x1="0" y1="1" x2="820" y2="1" stroke="#ffa028" stroke-width="2"/>
  <line x1="0" y1="103" x2="820" y2="103" stroke="#222222" stroke-width="1"/>

  <!-- Geometric Isometric Monogram Mark -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="60" height="60" fill="#0c0c0c" stroke="#33220a" stroke-width="1.5"/>
    <!-- Vertical Structural Pillars (M / H hybrid) -->
    <rect x="11" y="14" width="6" height="32" fill="#ffa028"/>
    <rect x="27" y="20" width="6" height="26" fill="#00d26a"/>
    <rect x="43" y="10" width="6" height="36" fill="#ffa028"/>
    <!-- Crossbar & Wick Details -->
    <rect x="11" y="27" width="38" height="3" fill="#ffd400"/>
    <line x1="14" y1="8" x2="14" y2="52" stroke="#ffa028" stroke-width="1.5"/>
    <line x1="30" y1="13" x2="30" y2="50" stroke="#00d26a" stroke-width="1.5"/>
    <line x1="46" y1="6" x2="46" y2="52" stroke="#ffa028" stroke-width="1.5"/>
  </g>

  <!-- Primary Institutional Wordmark -->
  <text x="104" y="54" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'SFMono-Regular', monospace" font-size="34" font-weight="700" fill="#f2f2f2" letter-spacing="3">MARKET HOLDER</text>
  <rect x="424" y="32" width="66" height="22" fill="#ffa028"/>
  <text x="433" y="47" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#000000" letter-spacing="1">ENGINE</text>

  <!-- Technical Subtitle -->
  <text x="105" y="78" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#8c8c8c" letter-spacing="0.8">MULTI-ASSET MATCHING ENGINE · DETERMINISTIC REPLAY · TERMINAL UI</text>

  <!-- Right-side System Spec Telemetry -->
  <line x1="636" y1="20" x2="636" y2="84" stroke="#1f1f1f" stroke-width="1"/>
  <text x="652" y="38" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#7a7a7a">ARITHMETIC   <tspan fill="#ececec">DECIMAL-128</tspan></text>
  <text x="652" y="55" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#7a7a7a">PROTOCOL     <tspan fill="#00d26a">FIX 4.2 / WS</tspan></text>
  <text x="652" y="72" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#7a7a7a">LOOKAHEAD    <tspan fill="#ffd400">STRICT ZERO</tspan></text>
</svg>
