[project]
name = "market-holder"
version = "0.2.0"
description = "Deterministic multi-asset matching engine, historical replay clock, and terminal workstation"
requires-python = ">=3.12"
dependencies = ["tzdata; sys_platform == 'win32'"]  # zoneinfo no Windows não traz a base de fusos

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
api = ["fastapi", "uvicorn", "websockets"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: acessa a rede (rode com --live)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
